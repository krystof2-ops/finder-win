[package]
name = "finder-win"
version = "1.4.0"
description = "A macOS Finder-like file explorer for Windows"
authors = ["krystof2-ops"]
license = "MIT"
repository = "https://github.com/krystof2-ops/finder-win"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset obsluhuje URL z convertFileSrc — bez něj se náhledy nenačtou.
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
dirs = "6.0.0"
opener = "0.8.5"
trash = "5.2.6"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-store = "2"
walkdir = "2"
# Hlídání otevřených složek — výpis se obnoví sám, když se v nich něco změní.
notify = "8"
# Ikony ze shellu: HBITMAP → PNG → data URL.
png = "0.18"
base64 = "0.23"
encoding_rs = "0.8"

[target."cfg(windows)".dependencies]
# Cesty souborů přetažených z Průzkumníku (postMessageWithAdditionalObjects).
# Stejná verze, jakou už táhne wry — nic nového se nekompiluje.
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # Ikony souborů ze shellu (HBITMAP → pixely přes GetDIBits).
    "Win32_Graphics_Gdi",
    # Schránka se soubory (CF_HDROP) — OpenClipboard, GlobalAlloc.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    # Vlastnosti médií pro náhledový sloupec (délka videa, rozměry, počet stran).
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # ShellExecuteW s verbem "openas" (dialog Otevřít v aplikaci) a COM pro něj.
    "Win32_System_Com",
    # Dotaz na sběrnici disku — USB SSD se hlásí jako pevný disk, ne jako výměnný.
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    # Výčet telefonů a fotoaparátů v „Tento počítač" (IShellItem::GetAttributes).
    "Win32_System_SystemServices",
    # Nastavení Průzkumníku „Zobrazovat skryté soubory" jako výchozí stav.
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Menší a rychlejší release build. panic = abort je v pořádku — aplikace
# panic nezachytává, jen by ho rozvinula a skončila stejně.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
